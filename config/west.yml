manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    # nice-view-battery (geratrevino115 fork) temporalmente deshabilitado:
    # rompía el firmware en runtime (no enumeraba USB/BT). Re-habilitar al arreglarlo.
    # - name: geratrevino115
    #   url-base: https://github.com/geratrevino115
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # - name: nice-view-battery
    #   remote: geratrevino115
    #   revision: main
  self:
    path: config
